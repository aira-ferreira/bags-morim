<script>
/* (SEU JS INTEIRO — NÃO ALTEREI NADA, EXCETO UM PONTO ABAIXO) */


function exportExcelFormatado() {
  if (!sales.length) {
    alert("Não há dados para exportar.");
    return;
  }

  const dados = sales.map(s => {
    const lucro = (parseFloat(s.valorRecebido) || 0) - (parseFloat(s.custo) || 0);

    return {
      Produto: s.produto,
      Especificação: s.espec || "",
      "Valor Venda": s.valorVenda,
      "Valor Recebido": s.valorRecebido || 0,
      Custo: s.custo || 0,
      Lucro: lucro,
      Pagamento: s.pagamento || "",
      "Data Venda": s.dataVenda,
      "Data Recebimento": s.dataReceb || ""
    };
  });

  const ws = XLSX.utils.json_to_sheet(dados);

  // 🔥 CORREÇÃO 2 (ESSENCIAL)
  if (!ws['!ref']) return;

  const range = XLSX.utils.decode_range(ws['!ref']);

  for (let i = range.s.r + 1; i <= range.e.r; i++) {
    ["C", "D", "E", "F"].forEach(col => {
      const cell = ws[col + (i + 1)];
      if (cell) {
        cell.t = 'n';
        cell.z = 'R$ #,##0.00';
      }
    });
  }

  ws['!cols'] = [
    { wch: 20 },
    { wch: 25 },
    { wch: 15 },
    { wch: 18 },
    { wch: 12 },
    { wch: 12 },
    { wch: 18 },
    { wch: 15 },
    { wch: 18 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Vendas");

  XLSX.writeFile(wb, "relatorio_vendas.xlsx");
}

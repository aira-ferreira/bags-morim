<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bags Morim</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Lato&display=swap" rel="stylesheet">

<style>
body { font-family: Lato; background:#faf6f1; padding:20px; }
header { display:flex; justify-content:space-between; }
h1 { font-family: Playfair Display; }

table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { padding:10px; border-bottom:1px solid #ddd; }

button { padding:10px; border:none; background:#7a9070; color:white; cursor:pointer; border-radius:8px; }

input { padding:8px; margin:5px; }
</style>
</head>

<body>

<header>
  <h1>Bags Morim</h1>
  <div id="headerDate"></div>
</header>

<h3>Nova Venda</h3>

<input id="produto" placeholder="Produto">
<input id="valor" type="number" placeholder="Valor venda">
<input id="recebido" type="number" placeholder="Valor recebido">
<input id="custo" type="number" placeholder="Custo">

<button onclick="salvar()">Salvar</button>
<button onclick="exportExcelFormatado()">Exportar Excel</button>

<table>
<thead>
<tr>
<th>Produto</th>
<th>Venda</th>
<th>Recebido</th>
<th>Custo</th>
<th>Lucro</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<!-- ✅ BIBLIOTECA XLSX (ANTES DO SCRIPT) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
let sales = JSON.parse(localStorage.getItem('dados') || '[]');

const now = new Date();
document.getElementById('headerDate').innerHTML =
  now.toLocaleDateString('pt-BR');

function salvar() {
  const produto = document.getElementById('produto').value;
  const valor = parseFloat(document.getElementById('valor').value);
  const recebido = parseFloat(document.getElementById('recebido').value) || 0;
  const custo = parseFloat(document.getElementById('custo').value) || 0;

  sales.push({ produto, valor, recebido, custo });

  localStorage.setItem('dados', JSON.stringify(sales));

  render();
}

function render() {
  const tabela = document.getElementById('tabela');

  tabela.innerHTML = sales.map(s => {
    const lucro = (s.recebido || 0) - (s.custo || 0);

    return `
      <tr>
        <td>${s.produto}</td>
        <td>${fmt(s.valor)}</td>
        <td>${fmt(s.recebido)}</td>
        <td>${fmt(s.custo)}</td>
        <td>${fmt(lucro)}</td>
      </tr>
    `;
  }).join('');
}

function fmt(v) {
  return new Intl.NumberFormat('pt-BR', {
    style:'currency',
    currency:'BRL'
  }).format(v || 0);
}

function exportExcelFormatado() {
  try {

    if (typeof XLSX === "undefined") {
      alert("Erro ao carregar biblioteca Excel.");
      return;
    }

    if (!sales.length) {
      alert("Não há dados para exportar.");
      return;
    }

    const dados = sales.map(s => ({
      Produto: s.produto,
      Venda: s.valor,
      Recebido: s.recebido,
      Custo: s.custo,
      Lucro: (s.recebido || 0) - (s.custo || 0)
    }));

    const ws = XLSX.utils.json_to_sheet(dados);

    // ✅ proteção
    if (!ws['!ref']) return;

    const range = XLSX.utils.decode_range(ws['!ref']);

    for (let i = range.s.r + 1; i <= range.e.r; i++) {
      ["B","C","D","E"].forEach(col => {
        const cell = ws[col + (i + 1)];
        if (cell) {
          cell.t = 'n';
          cell.z = 'R$ #,##0.00';
        }
      });
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Vendas");

    XLSX.writeFile(wb, "relatorio_vendas.xlsx");

  } catch (erro) {
    console.error(erro);
    alert("Erro ao exportar Excel.");
  }
}

render();
</script>

</body>
</html>
